<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500&family=Readex+Pro:wght@200;300;400;500&family=El+Messiri:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/rtl.css" />
  <title>تواصل معنا – مجموعة شركات شوق الدولية</title>
  <meta name="description" content="تواصل مع شوق الدولية: 0935122223 – ‎+966593491513 – دمشق، مجمع أبناء الحاج علي الشيخ، الطابق الأول، مكتب 204." />
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <section class="page-hero" data-bg="sky">
    <div class="container">
      <p class="crumbs"><a href="index.html">الرئيسية</a> / تواصل معنا</p>
      <h1 class="h-xl">تواصل معنا</h1>
      <p>للحجز والاستفسار الفوري — نحن بخدمتك.</p>
    </div>
  </section>

  <section class="section" style="padding-top:40px">
    <div class="container">
      <div class="contact-cards" id="contactCards"></div>

      <div class="contact-layout">
        <div class="reveal">
          <span class="eyebrow">راسلنا</span>
          <h2 class="h-lg" style="margin-bottom:24px">زورنا أو راسلنا</h2>
          <p>مكتبنا: دمشق – مجمع أبناء الحاج علي الشيخ – الطابق الأول – مكتب 204. للحجز اتصل أو راسلنا واتساب على 0935122223، أو ابعتلنا رسالة من هون وبتوصلنا مباشرة على الواتساب.</p>
          <div class="contact-social" id="contactSocial"></div>
        </div>

        <form class="form form--2 reveal" data-mail="استفسار من الموقع">
          <div class="field"><label for="cName">الاسم الكامل</label><input id="cName" name="الاسم" required /></div>
          <div class="field"><label for="cPhone">رقم الهاتف / واتساب</label><input id="cPhone" name="الهاتف" type="tel" dir="ltr" required /></div>
          <div class="field"><label for="cDest">الوجهة</label><input id="cDest" name="الوجهة" placeholder="مثال: مكة المكرمة" /></div>
          <div class="field"><label for="cSubject">نوع الطلب</label>
            <select id="cSubject" name="نوع الطلب">
              <option>عمرة</option><option>حج</option><option>برنامج خاص لمجموعة</option><option>زيارات دينية</option>
              <option>تأشيرة سياحية / تجارية / شنغن</option><option>موافقة أمنية</option><option>تذكرة طيران</option><option>حجز فندق</option><option>نقل بري دولي</option><option>برنامج سياحي</option><option>تأسيس شركة / إقامة / جنسية</option><option>أخرى</option>
            </select></div>
          <div class="field full"><label for="cMessage">رسالتك</label><textarea id="cMessage" name="الرسالة" required></textarea></div>
          <div class="full">
            <button class="btn btn--solid">إرسال الرسالة
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12h15M14 6l6 6-6 6"/></svg></button>
            <p class="form__msg" style="margin-top:12px"></p>
          </div>
        </form>
      </div>

      <div class="map reveal">
        <iframe title="موقع المكتب" loading="lazy" src="https://www.google.com/maps?q=%D8%AF%D9%85%D8%B4%D9%82+%D8%B3%D9%88%D8%B1%D9%8A%D8%A7&z=13&output=embed"></iframe>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
