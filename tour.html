<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500&family=Readex+Pro:wght@200;300;400;500&family=El+Messiri:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/rtl.css" />
  <title>تفاصيل العرض – مجموعة شركات شوق الدولية</title>
  <meta name="description" content="تفاصيل العرض وطلب الحجز مع مجموعة شركات شوق الدولية." />
</head>
<body data-page="tour">
  <div id="site-header"></div>

  <section class="page-hero tour-hero" id="tourHero">
    <div class="container">
      <p class="crumbs"><a href="index.html">الرئيسية</a> / <a href="tours.html">العروض</a></p>
      <span class="eyebrow" id="tourType"></span>
      <h1 class="h-lg" id="tourTitle" style="max-width:900px"></h1>
      <div class="tour-meta" id="tourMeta"></div>
    </div>
  </section>

  <section class="section" style="padding-top:60px">
    <div class="container tour-layout">
      <div id="tourBody"></div>

      <aside class="book-card">
        <h3>احجز أو استفسر</h3>
        <p>ابعتلنا بياناتك ومنتواصل معك لنأكد الموعد والتفاصيل والسعر.</p>
        <form class="form" data-mail="طلب حجز">
          <input type="hidden" name="الرحلة" id="bookTour" />
          <div class="field"><label for="bName">الاسم الكامل</label><input id="bName" name="الاسم" required /></div>
          <div class="field"><label for="bPhone">رقم الهاتف / واتساب</label><input id="bPhone" name="الهاتف" type="tel" dir="ltr" required /></div>
          <div class="field"><label for="bDate">التاريخ المطلوب</label><input id="bDate" name="التاريخ" type="date" /></div>
          <div class="field"><label for="bPax">عدد الأشخاص</label>
            <select id="bPax" name="عدد الأشخاص"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5 أو أكثر</option></select></div>
          <button class="btn btn--solid">إرسال الطلب
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12h15M14 6l6 6-6 6"/></svg></button>
          <p class="form__msg"></p>
        </form>
        <a class="btn btn--wa" id="tourWa" href="#" target="_blank" rel="noopener">استفسر عبر واتساب</a>
      </aside>
    </div>
  </section>

  <section class="section section--tight">
    <div class="container">
      <div class="section-head reveal"><div><h2 class="h-md">خدمات قد تهمّك</h2></div>
        <a href="tours.html" class="link-all">كل العروض
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12h15M14 6l6 6-6 6"/></svg></a></div>
      <div class="tours-grid" id="relatedTours"></div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
